font_family FiraCodeNerdFontMono

confirm_os_window_close 0

# nvim opens previews in a split of its own window (markdown ftplugin, <leader>mt)
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}
enabled_layouts splits,stack
remember_window_size false
# radian: Shift+Enter → F24 (\e[24;2~), bound to completion in configs/radian/keys.py
map --when-focus-on title:^radian$ shift+enter send_text all \x1b[24;2~
