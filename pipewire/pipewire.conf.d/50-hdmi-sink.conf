# Dedicated HDMI sink for the built-in Intel card, alongside the analog one.
#
# The card exposes separate PCMs (hw:PCH,0 analog, hw:PCH,3 HDMI 0), but ACP -
# the profile layer inherited from PulseAudio - groups them into mutually
# exclusive profiles: picking "Salida Estéreo digital (HDMI)" kills the laptop
# speakers, and analog wins on priority (6565 vs 5965) so HDMI never appears at
# all. Disabling ACP wholesale would expose every PCM but also drop jack
# detection, so headphones would no longer mute the speakers on this codec
# (ALC256 has no Auto-Mute Mode control - the ports are what switch it).
#
# So: keep ACP on the analog side and bolt the HDMI PCM on as a static node.
# Low priority, so it never steals the default sink - pick it explicitly.
context.objects = [
  { factory = adapter
    args = {
      factory.name       = api.alsa.pcm.sink
      node.name          = "alsa_output.hdmi-tv"
      node.description   = "HDMI"
      media.class        = "Audio/Sink"
      api.alsa.path      = "hw:PCH,3"
      audio.channels     = 2
      audio.position     = "FL,FR"
      priority.driver    = 100
      priority.session   = 100
      node.pause-on-idle = false
    }
  }
]
